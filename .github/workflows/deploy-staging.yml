# CD vers la RECETTE (T-04, CDC §15.3) : chaque fusion dans main dont la CI est verte est déployée.
#   1. build des images api et web, poussées sur GHCR avec le tag sha-<commit> ;
#   2. déploiement en recette (environnement GitHub « staging »), sans approbation.
# Les mêmes images seront promues en production par deploy-production.yml : on ne reconstruit jamais.
name: CD recette

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Redéploiement manuel du dernier commit de main (après une panne du PC, par exemple)
  workflow_dispatch:

permissions: {}

concurrency:
  group: cd-staging
  cancel-in-progress: false

jobs:
  images:
    name: Images Docker (GHCR)
    # Uniquement après une CI verte sur un push dans main de ce dépôt : jamais pour une PR, ni un fork
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Version et nom des images
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          sha=$(git rev-parse HEAD)
          {
            echo "sha=$sha"
            echo "version=sha-$sha"
            echo "prefix=ghcr.io/${OWNER,,}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image api (php-fpm, worker, migrations)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/sidekey-api:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Image web (front + Caddy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/sidekey-web:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Recette
    needs: images
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      version: ${{ needs.images.outputs.version }}
      ref: ${{ needs.images.outputs.sha }}
    secrets: inherit
