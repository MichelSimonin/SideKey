name: CI

on:
  pull_request:
  push:
    branches: [main]

# Droits minimaux pour le GITHUB_TOKEN
permissions:
  contents: read

# Une seule exécution par branche : la nouvelle annule l'ancienne
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Symfony)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    # Tests d'intégration : PostgreSQL (stock, réservations) et Redis (panier, minuteur), jetables
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres   # base jetable de la CI, sans lien avec un vrai secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # En test, Doctrine ajoute le suffixe _test : les tests utilisent la base sidekey_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sidekey?serverVersion=17&charset=utf8
      REDIS_URL: redis://localhost:6379
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, redis, sodium, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Fichier .env (valeurs d'exemple, sans secret)
        run: cp .env.example .env

      - name: Valider composer.json
        run: composer validate --strict

      - name: Installer les dépendances
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Audit de sécurité des dépendances
        run: composer audit --no-dev --abandoned=report

      - name: Lint de la configuration
        run: |
          php bin/console lint:yaml config --parse-tags
          php bin/console lint:container

      - name: Base de test (schéma, fonctions, triggers et jeu d'essai)
        run: PGDATABASE=sidekey_test sh sql/bin/db-seed.sh --reset

      - name: Tests PHPUnit
        run: php bin/phpunit --testdox

  front:
    name: Front (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Installer les dépendances
        run: npm ci --no-fund

      - name: Audit de sécurité des dépendances
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tests Vitest
        run: npm test

      - name: Build (vérifie aussi les types)
        run: npm run build

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Valider compose.yaml
        run: |
          cp .env.example .env
          docker compose config --quiet

      # Stack de recette et de production (T-04) : fichier compose et script de déploiement
      - name: Valider deploy/compose.yaml
        run: IMAGE_TAG=sha-0000000 docker compose --file deploy/compose.yaml --env-file deploy/.env.example config --quiet

      - name: ShellCheck de deploy/deploy.sh
        run: shellcheck deploy/deploy.sh

      # Les images de production doivent se construire dès la PR, pas seulement après la fusion
      - uses: docker/setup-buildx-action@v3

      - name: Build de l'image api (production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          load: true
          tags: localhost:5000/sidekey-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=api

      - name: Build de l'image web (production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          load: true
          tags: localhost:5000/sidekey-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web

      # Répétition du déploiement réel : registre local à la place de GHCR, dossier temporaire à la place
      # du PC. Exerce deploy.sh de bout en bout (rôles, sauvegarde, migrations Doctrine sur base vide,
      # démarrage, test de fumée) et la sauvegarde manuelle.
      - name: Répétition du déploiement (deploy.sh)
        env:
          VERSION: sha-${{ github.sha }}
        run: |
          docker run -d --name registre -p 127.0.0.1:5000:5000 registry:2
          for image in sidekey-api sidekey-web; do docker push --quiet "localhost:5000/$image:$VERSION"; done
          cible="$RUNNER_TEMP/sidekey/staging"
          mkdir -p "$cible/roles"
          cp deploy/compose.yaml deploy/deploy.sh "$cible/"
          cp api/sql/roles/01_roles.sql "$cible/roles/"
          {
            echo SIDEKEY_ENV=staging
            echo IMAGE_PREFIX=localhost:5000
            echo HTTP_PORT=8081
            echo PUBLIC_URL=http://127.0.0.1:8081
            echo POSTGRES_DB=sidekey
            echo POSTGRES_USER=sidekey_admin
            for n in APP_SECRET POSTGRES_PASSWORD SK_OWNER_PASSWORD SK_APP_PASSWORD SK_REPORTING_PASSWORD SK_BACKUP_PASSWORD REDIS_PASSWORD; do
              echo "$n=$(openssl rand -hex 32)"
            done
          } > "$cible/.env"
          bash "$cible/deploy.sh" deploy "$VERSION"
          curl --fail --silent http://127.0.0.1:8081/ | grep -q '<div id="root">'
          curl --fail --silent --head http://127.0.0.1:8081/ | grep -qi '^content-security-policy:'
          curl --fail --silent http://127.0.0.1:8081/api/panier | grep -q '"lignes":\[\]'
          bash "$cible/deploy.sh" backup
          bash "$cible/deploy.sh" status

  database:
    name: Base de données (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres   # base jetable de la CI, sans lien avec un vrai secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # pg_dump refuse un serveur plus récent que lui : client de même version majeure que le serveur
      - name: Client PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Migrations sur base vide et tests SQL
        run: sh api/tests/Database/run.sh

  # Seul contrôle exigé par la protection de main : ajouter un job ici ne demande pas de modifier la règle
  ci-success:
    name: ci-success
    if: always()
    needs: [api, front, docker, database]
    runs-on: ubuntu-latest
    steps:
      - name: Tous les jobs doivent réussir
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::Un job de la CI n'a pas réussi ($r)"
              exit 1
            fi
          done
