# CD vers la PRODUCTION (T-04, CDC §15.3) : déclenchée par un tag vX.Y.Z posé sur un commit de main.
#   1. promotion : les images sha-<commit> déjà testées en recette reçoivent le tag vX.Y.Z (sans rebuild) ;
#   2. déploiement en production : l'environnement GitHub « production » exige l'approbation de l'autre
#      membre du binôme avant que le job ne démarre ;
#   3. publication de la release GitHub avec le changelog généré.
name: CD production

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promouvoir les images de la recette
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Vérifier le tag
        id: meta
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::Tag $TAG invalide : attendu vX.Y.Z"; exit 1; }
          sha=$(git rev-parse "$TAG^{commit}")
          # Seul un commit de main (donc relu, fusionné et passé par la recette) part en production
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::Le commit $sha du tag $TAG n'est pas sur main"; exit 1; }
          {
            echo "sha=$sha"
            echo "version=$TAG"
            echo "prefix=ghcr.io/${OWNER,,}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Échoue si le commit n'a jamais été construit par la CD recette : rien n'est livré sans avoir été testé
      - name: Ajouter le tag de version aux images testées
        env:
          PREFIX: ${{ steps.meta.outputs.prefix }}
          SHA: ${{ steps.meta.outputs.sha }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for image in sidekey-api sidekey-web; do
            docker buildx imagetools create --tag "$PREFIX/$image:$VERSION" "$PREFIX/$image:sha-$SHA"
          done

  deploy:
    name: Production
    needs: promote
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      version: ${{ needs.promote.outputs.version }}
      ref: ${{ needs.promote.outputs.sha }}
    secrets: inherit

  release:
    name: Release GitHub
    needs: [promote, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publier la release et son changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.promote.outputs.version }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "SideKey $TAG"
