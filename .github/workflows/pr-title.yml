name: PR title

# Le titre de la PR devient le message du commit (squash merge) :
# il doit suivre Conventional Commits.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Vérifier le format Conventional Commits
        env:
          # Passé par variable d'environnement, jamais interpolé dans le script (évite l'injection)
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .{3,100}$'
          echo "Titre : $TITLE"
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "Format valide."
          else
            echo "::error::Titre invalide. Attendu : type(portée optionnelle): description"
            echo "Types : feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            echo "Exemple : feat(panier): réservation temporaire de 15 minutes"
            exit 1
          fi
