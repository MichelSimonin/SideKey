server {
    listen 80;
    server_name localhost;
    root /var/www/api/public;

    client_max_body_size 12M;
    server_tokens off;

    # En-têtes de sécurité de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Jaquettes téléversées par le back-office (F-09). Seuls les fichiers « jaquettes/<nom>.webp » sont servis, comme images
    # statiques : jamais de code exécuté, type fixé, aucun sniffing, aucun script ni cadre possible (CSP « default-src 'none' »).
    # Déclarée avant le blocage des .php : un nom qui correspond à ce motif ne peut pas se terminer par .php.
    location ~ ^/media/jaquettes/[A-Za-z0-9_-]+\.webp$ {
        try_files $uri =404;
        types { }
        default_type image/webp;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=86400";   # réponses réussies seulement ; le nom change à chaque téléversement : aucune image périmée
    }

    # Tout le reste de /media/ (autre extension, sous-dossier, fichier déposé à la main) : introuvable.
    location /media/ {
        return 404;
    }

    # Aucun autre fichier .php n'est exécutable
    location ~ \.php$ {
        return 404;
    }

    # Fichiers cachés (.env, .git…) jamais servis
    location ~ /\. {
        deny all;
    }
}
