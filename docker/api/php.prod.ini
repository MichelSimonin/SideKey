; Réglages PHP de recette et de production (T-04)
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 30
expose_php = Off
date.timezone = Europe/Paris

; Aucune erreur affichée au client : elles partent dans le journal du conteneur
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Opcache : le code ne change jamais dans le conteneur, inutile de revérifier les fichiers
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Sessions non utilisées (API stateless JWT), mais cookie durci par défaut
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1
