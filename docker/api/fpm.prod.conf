; Pool PHP-FPM de recette et de production (T-04)
[global]
; Journaux sur la sortie standard du conteneur (docker compose logs)
error_log = /proc/self/fd/2

[www]
; Les variables d'environnement du conteneur (DATABASE_URL, APP_SECRET…) doivent atteindre PHP
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Petite machine : nombre de processus borné
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Le journal d'accès est tenu par Caddy
access.log = /dev/null
