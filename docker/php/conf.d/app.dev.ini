; Réglages PHP de développement
memory_limit = 512M
upload_max_filesize = 10M
post_max_size = 12M
expose_php = Off
date.timezone = Europe/Paris
display_errors = On
error_reporting = E_ALL

; Opcache : revalide les fichiers à chaque requête en dev
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Xdebug (actif seulement si XDEBUG_MODE n'est pas "off")
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = yes

; Sessions non utilisées (API stateless JWT), mais cookie durci par défaut
session.cookie_httponly = 1
session.cookie_samesite = Lax
